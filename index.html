<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сборщик правил для Mihomo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚡ Сборщик правил для Mihomo</h1>
        <p>Выбери нужные правила и скачай готовый конфиг</p>
        
        <!-- Категории -->
        <div class="categories" id="categories">
            <button class="cat-btn active" data-category="all">📋 Все</button>
            <button class="cat-btn" data-category="social">🌐 Соцсети</button>
            <button class="cat-btn" data-category="streaming">🎬 Стриминг</button>
            <button class="cat-btn" data-category="games">🎮 Игры</button>
            <button class="cat-btn" data-category="work">💼 Работа</button>
            <button class="cat-btn" data-category="it">☁️ IT & Облака</button>
            <button class="cat-btn" data-category="shopping">🛒 Покупки</button>
            <button class="cat-btn" data-category="music">🎵 Музыка</button>
        </div>

        <div class="rules-grid" id="rulesGrid">
            <!-- Карточки будут сгенерированы через JavaScript -->
        </div>

        <div class="controls">
            <button id="selectAllBtn" class="btn btn-secondary">✅ Выбрать все</button>
            <button id="deselectAllBtn" class="btn btn-secondary">❌ Снять все</button>
            <span id="selectedCount" class="selected-count">Выбрано: 0</span>
        </div>

        <button id="downloadBtn" class="download-btn">
            📥 Скачать config.yaml
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
