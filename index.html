<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сборщик правил для Mihomo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚡ Сборщик правил для Mihomo</h1>
        <p>Выбери нужные правила и скачай готовый конфиг</p>
        
        <div class="rules-grid" id="rulesGrid">
            <!-- Карточки будут сгенерированы автоматически через JavaScript -->
        </div>

        <div class="controls">
            <button id="selectAllBtn" class="btn btn-secondary">✅ Выбрать все</button>
            <button id="deselectAllBtn" class="btn btn-secondary">❌ Снять все</button>
        </div>

        <button id="downloadBtn" class="download-btn">
            📥 Скачать config.yaml
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
