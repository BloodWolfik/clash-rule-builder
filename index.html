<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihomo Rules Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Mihomo Rules Builder</h1>
            <p>Выбери провайдера, категорию и правила для своего конфига</p>
        </header>

        <!-- Выбор автора -->
        <div class="selector-group">
            <label for="authorSelect">📦 Провайдер правил</label>
            <select id="authorSelect">
                <!-- Заполняется из JavaScript -->
            </select>
        </div>

        <!-- Категории -->
        <div class="categories" id="categories">
            <!-- Заполняется из JavaScript -->
        </div>

        <!-- Сетка правил -->
        <div class="rules-grid" id="rulesGrid"></div>

        <!-- Управление -->
        <div class="controls">
            <button id="selectAllBtn" class="btn btn-secondary">✅ Выбрать все</button>
            <button id="deselectAllBtn" class="btn btn-secondary">❌ Снять все</button>
            <span id="selectedCount" class="selected-count">Выбрано: 0</span>
        </div>

        <button id="downloadBtn" class="download-btn">
            📥 Скачать config.yaml
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
